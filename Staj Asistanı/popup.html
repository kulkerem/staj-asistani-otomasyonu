<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Staj Asistanı</title>
    <style>
        body {
            width: 250px;
            font-family: Arial, sans-serif;
            padding: 10px;
            background-color: #f4f6f9;
            color: #333;
        }
        h3 {
            text-align: center;
            color: #007bff;
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            font-size: 12px;
            font-weight: bold;
            display: block;
            margin-bottom: 3px;
        }
        input {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 8px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <h3>Staj Asistanı</h3>
    
    <div class="form-group">
        <label>Ad Soyad</label>
        <input type="text" id="adSoyad" placeholder="Kerem ...">
    </div>
    
    <div class="form-group">
        <label>E-posta</label>
        <input type="email" id="eposta" placeholder="ornek@mail.com">
    </div>

    <div class="form-group">
        <label>GitHub / LinkedIn URL</label>
        <input type="text" id="profilUrl" placeholder="linkedin.com/in/...">
    </div>

    <button id="kaydetBtn">Bilgileri Kaydet</button>

    <script src="popup.js"></script>
</body>
</html>
